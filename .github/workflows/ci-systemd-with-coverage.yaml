name: ci-test-with-coverage

on:
  push:
# Declare default permissions as read only.
permissions: read-all

jobs:
  build:
    name: Test KubeArmor in Systemd Mode
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'KubeArmor/go.mod'

      - name: Install the latest LLVM toolchain
        run: ./.github/workflows/install-llvm.sh

      - name: Compile libbpf
        run: ./.github/workflows/install-libbpf.sh

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v2
        with:
          install-only: true
          version: v1.25.0

      - name: Install protoc
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Build Coverage Test Binary
        run: make local-release-coverage
        working-directory: KubeArmor

      - name: Create coverage output directory
        run: |
          sudo mkdir -p /coverage
          sudo chmod 777 /coverage

      - name: Run KubeArmor Test Binary with Coverage (Background)
        run: |
          REPO_ROOT="$(pwd)"
          CONFIG_PATH="$REPO_ROOT/packaging/kubearmor.yaml"

          echo "Repository Root: $REPO_ROOT"
          echo "Using config: $CONFIG_PATH"
          test -f "$CONFIG_PATH" && echo "Config file found" || (echo "Config file NOT found!" && exit 1)

          sudo env KUBEARMOR_CFG="$CONFIG_PATH" \
            ./kubearmor -test.coverprofile=/coverage/systemd_coverage.out \
            > kubearmor.log 2>&1 &

          echo $! > kubearmor.pid
          echo "KubeArmor PID: $(cat kubearmor.pid)"

          sleep 15
        working-directory: KubeArmor

      - name: Test KubeArmor using Ginkgo
        run: |
          go install -mod=mod github.com/onsi/ginkgo/v2/ginkgo
          make
        working-directory: ./tests/nonk8s_env
        timeout-minutes: 30

      - name: Stop KubeArmor and Extract Coverage
        if: always()
        run: |
          cd KubeArmor

          echo "Process running"
          ps aux | grep kubearmor

          if [ -f kubearmor.pid ]; then
            PID=$(cat kubearmor.pid)
            echo "Stopping KubeArmor PID=$PID with SIGINT"
            sudo kill -INT $PID || true
          fi

          echo "before pkill Process running"
          ps aux | grep kubearmor
          sudo pkill kubearmor

          echo "After pkill Process running"
          ps aux | grep kubearmor
          # wait for graceful shutdown and coverage flush
          for i in {1..30}; do
            if [ ! -f kubearmor.pid ]; then break; fi
            if ! ps -p $(cat kubearmor.pid) > /dev/null; then break; fi
            sleep 1
          done

          # remove pid file
          rm -f kubearmor.pid || true

          # wait for coverage file to be written
          for i in {1..4}; do
            if [ -f /coverage/systemd_coverage.out ]; then
              cp /coverage/systemd_coverage.out systemd_coverage.out
              chmod 644 systemd_coverage.out
              break
            fi
            sleep 5
          done
          
          echo "Process running"
          ps aux | grep kubearmor

          ls -l .


      - name: Upload KubeArmor Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubearmor_logs
          path: KubeArmor/kubearmor.log

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemd_coverage
          path: KubeArmor/systemd_coverage.out
